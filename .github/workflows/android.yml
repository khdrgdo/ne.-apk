name: Android build
on:
  push:
    branches: ["feat/nexus-android-1.2.0", "main"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Android source
        uses: actions/checkout@v4
      - name: Checkout NEXUS web configuration
        uses: actions/checkout@v4
        with:
          repository: khdrgdo/khac
          ref: main
          path: web-config
      - name: Read public Supabase client configuration
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          values = {}
          for line in open('web-config/.env', encoding='utf-8'):
              line = line.strip()
              if not line or line.startswith('#') or '=' not in line: continue
              key, value = line.split('=', 1)
              values[key.strip()] = value.strip().strip('"').strip("'")
          url = values.get('SUPABASE_URL') or values.get('VITE_SUPABASE_URL')
          key = values.get('SUPABASE_PUBLISHABLE_KEY') or values.get('VITE_SUPABASE_PUBLISHABLE_KEY')
          if not url or not key or not key.startswith('sb_publishable_'):
              raise SystemExit('Missing or unexpected public Supabase client configuration')
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as env:
              env.write('SUPABASE_URL=' + url + '\n')
              env.write('SUPABASE_PUBLISHABLE_KEY=' + key + '\n')
          PY
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build and test
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - name: Publish APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS-1.2.0-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
