name: Android build
on:
  push:
    branches: ["feat/nexus-android-1.2.0", "main"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Android source
        uses: actions/checkout@v4
      - name: Checkout NEXUS web configuration
        uses: actions/checkout@v4
        with:
          repository: khdrgdo/khac
          ref: main
          path: web-config
      - name: Read public Supabase client configuration
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          values = {}
          for line in open('web-config/.env', encoding='utf-8'):
              line = line.strip()
              if not line or line.startswith('#') or '=' not in line: continue
              key, value = line.split('=', 1)
              values[key.strip()] = value.strip().strip('"').strip("'")
          url = values.get('SUPABASE_URL') or values.get('VITE_SUPABASE_URL')
          key = values.get('SUPABASE_PUBLISHABLE_KEY') or values.get('VITE_SUPABASE_PUBLISHABLE_KEY')
          if not url or not key or not key.startswith('sb_publishable_'):
              raise SystemExit('Missing or unexpected public Supabase client configuration')
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as env:
              env.write('SUPABASE_URL=' + url + chr(10))
              env.write('SUPABASE_PUBLISHABLE_KEY=' + key + chr(10))
          print('::add-mask::' + url)
          print('::add-mask::' + key)
          PY
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build and test
        shell: bash
        run: |
          set -o pipefail
          timeout 420s gradle --no-daemon --console=plain --info --stacktrace --max-workers=2 -Pkotlin.compiler.execution.strategy=in-process :app:testDebugUnitTest :app:assembleDebug 2>&1 | tee gradle-build.log
      - name: Upload Gradle diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS-1.2.0-gradle-diagnostics
          path: gradle-build.log
          if-no-files-found: warn
      - name: Publish APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS-1.2.0-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Publish public preview APK release
        if: github.ref == 'refs/heads/feat/nexus-android-1.2.0'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.2.0-preview.1
          target_commitish: feat/nexus-android-1.2.0
          name: NEXUS 1.2.0 Preview 1
          prerelease: true
          make_latest: false
          generate_release_notes: true
          files: app/build/outputs/apk/debug/app-debug.apk
